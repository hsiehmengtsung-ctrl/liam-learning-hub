<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liam 學習複習中心 | Liam Learning Hub (G01–G12)</title>
  <style>
    /* ==========================================================================
       Design Tokens & Self-Contained Styles (Zero external dependencies)
       ========================================================================== */
    :root {
      --bg-page: #f4f7fb;
      --bg-surface: #ffffff;
      --bg-subtle: #eef3f9;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --border-light: #e2e8f0;
      --border-strong: #cbd5e1;
      --brand-blue: #0284c7;
      --brand-blue-dark: #0369a1;
      --brand-blue-soft: #e0f2fe;
      --brand-green: #059669;
      --brand-green-soft: #d1fae5;
      --brand-amber: #d97706;
      --brand-amber-soft: #fef3c7;
      --brand-rose: #e11d48;
      --brand-rose-soft: #ffe4e6;
      --brand-violet: #7c3aed;
      --brand-violet-soft: #ede9fe;
      --brand-lime: #4d7c0f;
      --brand-lime-soft: #ecfccb;
      --shadow-sm: 0 2px 10px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 10px 24px rgba(15, 23, 42, 0.09);
      --radius-xl: 22px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg-page);
      background-image:
        radial-gradient(circle at 8% 5%, rgba(2, 132, 199, 0.11) 0%, transparent 28%),
        radial-gradient(circle at 92% 8%, rgba(245, 158, 11, 0.11) 0%, transparent 30%),
        radial-gradient(circle at 84% 94%, rgba(124, 58, 237, 0.08) 0%, transparent 32%);
      color: var(--text-primary);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 18px 16px 72px;
    }

    /* ==========================================================================
       Header & Filter Dashboard
       ========================================================================== */
    .hub-header {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-xl);
      padding: 20px 18px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 22px;
    }

    .header-top {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--brand-blue-soft);
      color: var(--brand-blue-dark);
      font-size: 0.78rem;
      font-weight: 800;
    }

    .hub-title {
      margin: 6px 0 0;
      font-size: 1.58rem;
      font-weight: 800;
      letter-spacing: -0.015em;
    }

    .hub-subtitle {
      margin: 6px 0 0;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .stats-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      font-size: 0.84rem;
      color: var(--text-secondary);
    }

    .stats-strip strong {
      color: var(--text-primary);
    }

    .controls {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Search Input */
    .search-box {
      position: relative;
      width: 100%;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      min-height: 44px;
      padding: 10px 42px 10px 42px;
      border: 1.5px solid var(--border-light);
      border-radius: var(--radius-md);
      background: #f8fafc;
      color: var(--text-primary);
      font-size: 0.94rem;
      transition: border-color 0.16s ease, background-color 0.16s ease, box-shadow 0.16s ease;
    }

    .search-input:focus {
      outline: none;
      background: var(--bg-surface);
      border-color: var(--brand-blue);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.14);
    }

    .clear-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 26px;
      height: 26px;
      border: none;
      border-radius: 999px;
      background: #e2e8f0;
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .clear-btn.is-visible {
      display: inline-flex;
    }

    /* Filter Pill Groups */
    .filter-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .filter-label {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.03em;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .pill-btn {
      appearance: none;
      min-height: 36px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1.5px solid var(--border-light);
      background: var(--bg-surface);
      color: var(--text-secondary);
      font-size: 0.83rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .pill-btn:hover {
      border-color: var(--border-strong);
      background: #f8fafc;
      color: var(--text-primary);
    }

    .pill-btn.active {
      background: var(--brand-blue);
      border-color: var(--brand-blue);
      color: #ffffff;
      box-shadow: 0 3px 10px rgba(2, 132, 199, 0.22);
    }

    .pill-btn--subject.active {
      background: var(--text-primary);
      border-color: var(--text-primary);
      color: #ffffff;
      box-shadow: none;
    }

    .pill-badge {
      font-size: 0.7rem;
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.22);
    }

    /* ==========================================================================
       Sections & Cards Grid
       ========================================================================== */
    .grade-section {
      margin-top: 26px;
    }

    .section-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border-light);
    }

    .section-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-icon {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      background: var(--brand-blue-soft);
      color: var(--brand-blue-dark);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .section-title {
      margin: 0;
      font-size: 1.14rem;
      font-weight: 800;
    }

    .section-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .card-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    @media (min-width: 640px) {
      .container {
        padding: 24px 20px 80px;
      }
      .hub-header {
        padding: 26px;
      }
      .header-top {
        flex-direction: row;
        align-items: flex-start;
        justify-content: space-between;
      }
      .hub-title {
        font-size: 1.85rem;
      }
      .card-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 960px) {
      .card-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* Card Styles */
    .card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      background: var(--bg-surface);
      border: 1.5px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.17s ease, box-shadow 0.17s ease, border-color 0.17s ease;
    }

    .card--live {
      border-color: #bae6fd;
    }

    .card--live:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--brand-blue);
    }

    .card--planned {
      background: rgba(255, 255, 255, 0.72);
      border-style: dashed;
      border-color: var(--border-strong);
      cursor: default;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .subject-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      font-size: 0.76rem;
      font-weight: 700;
    }

    .chip-english { background: var(--brand-blue-soft); color: var(--brand-blue-dark); }
    .chip-math { background: var(--brand-amber-soft); color: var(--brand-amber); }
    .chip-mandarin { background: var(--brand-rose-soft); color: var(--brand-rose); }
    .chip-science { background: var(--brand-green-soft); color: var(--brand-green); }
    .chip-social { background: var(--brand-violet-soft); color: var(--brand-violet); }
    .chip-minecraft { background: var(--brand-lime-soft); color: var(--brand-lime); }
    .chip-music { background: var(--brand-violet-soft); color: var(--brand-violet); }

    .status-tag {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .status-tag--live {
      background: var(--brand-green-soft);
      color: var(--brand-green);
    }

    .status-tag--planned {
      background: var(--bg-subtle);
      color: var(--text-muted);
    }

    .card-title {
      margin: 0 0 6px;
      font-size: 1.04rem;
      font-weight: 800;
      line-height: 1.35;
      color: var(--text-primary);
    }

    .card-desc {
      margin: 0;
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .card-footer {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.76rem;
    }

    .card-path {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
      background: #f8fafc;
      padding: 2px 6px;
      border-radius: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-cta {
      font-weight: 800;
      color: var(--brand-blue);
      flex-shrink: 0;
    }

    /* Empty State */
    .empty-state {
      display: none;
      text-align: center;
      background: var(--bg-surface);
      border: 1.5px dashed var(--border-strong);
      border-radius: var(--radius-xl);
      padding: 40px 20px;
      margin-top: 24px;
    }

    .empty-state.is-visible {
      display: block;
    }

    .empty-state h3 {
      margin: 8px 0 4px;
      font-size: 1.08rem;
    }

    .empty-state p {
      margin: 0 0 14px;
      font-size: 0.88rem;
      color: var(--text-secondary);
    }

    .reset-btn {
      min-height: 40px;
      padding: 8px 18px;
      border: none;
      border-radius: 999px;
      background: var(--brand-blue);
      color: #ffffff;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
    }

    .hub-footer {
      margin-top: 48px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- ======================================================================
         Header & Interactive Filter Dashboard
         ====================================================================== -->
    <header class="hub-header">
      <div class="header-top">
        <div>
          <span class="eyebrow">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
            LIAM LEARNING HUB · G01–G12 全學齡架構
          </span>
          <h1 class="hub-title">Liam 學習複習中心</h1>
          <p class="hub-subtitle">
            收錄國小一年級至高中三年級（G01–G12）各科互動複習卡與 Minecraft、音樂跨年級專題
          </p>
        </div>

        <div class="stats-strip" aria-label="教材統計">
          <span>目前年級：<strong>二年級 G02</strong></span>
          <span>·</span>
          <span>已上線：<strong id="liveCount">0</strong> 份</span>
          <span>·</span>
          <span>目前顯示：<strong id="shownCount">0</strong> 項</span>
        </div>
      </div>

      <div class="controls">
        <!-- Keyword Search -->
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            id="searchInput"
            class="search-input"
            type="search"
            placeholder="搜尋單字、單元、年級或科目（例如：Spelling、Unit 7、G02、數學、麥塊、音樂...）"
            aria-label="搜尋教材關鍵字"
          />
          <button id="clearSearchBtn" class="clear-btn" type="button" aria-label="清除搜尋文字">✕</button>
        </div>

        <!-- Grade Selector Bar (G02 Default Active + G01~G12 + Topics) -->
        <div class="filter-block">
          <span class="filter-label">選擇年級或專題（預設顯示目前年級 G02）</span>
          <div class="pill-row" id="gradeFilterBar" role="group" aria-label="年級篩選"></div>
        </div>

        <!-- Subject Sub-Filters -->
        <div class="filter-block">
          <span class="filter-label">科目與專題子篩選</span>
          <div class="pill-row" id="subjectFilterBar" role="group" aria-label="科目篩選"></div>
        </div>
      </div>
    </header>

    <!-- Dynamic Rendered Sections Container -->
    <main id="sectionsContainer" aria-live="polite"></main>

    <!-- Empty Filter Result -->
    <div id="emptyState" class="empty-state" role="status">
      <div aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>
      <h3>找不到符合條件的學習卡片</h3>
      <p>可切換「全部 (All)」或「全部科目」，或清除搜尋關鍵字。</p>
      <button id="resetBtn" class="reset-btn" type="button">重設篩選（回到二年級 G02）</button>
    </div>

    <footer class="hub-footer">
      Liam Learning Hub · 一次建置 G01–G12 與 Topics 完整架構 · 單檔自包含靜態網站
    </footer>
  </div>

  <script>
    (function () {
      /* ========================================================================
         1. 【未來新增教材只需要改這裡！】
            以後每新增一份 HTML 教材，只要在下方 MATERIALS 陣列最前面貼上 1 段：
            {
              grade: 'g02',                                   // 年級：'g01' ~ 'g12' 或 'topics'
              subject: 'english',                             // 科目：'english' | 'math' | 'mandarin' | 'science' | 'social' | 'minecraft' | 'music'
              status: 'live',                                 // 狀態：'live'（已上線可點擊）
              title: '二年級英文 Unit 1 單字卡',               // 卡片標題
              desc: '含圖示、自然拼讀與發音練習',              // 卡片簡介
              href: './g02/english/g2-en-unit1.html',         // 對應檔案路徑
              tags: 'g02 二年級 english 英文 unit 1'           // 搜尋關鍵字
            },
         ======================================================================== */
      const DEFAULT_GRADE = 'g02'; // Liam 目前二年級；未來升三年級只要把這裡改成 'g03' 即可！

      const MATERIALS = [
        // --- 已上線教材 (Live Materials) ---
        {
          grade: 'g02',
          subject: 'english',
          status: 'live',
          title: '1B Spelling Contest Wordlist (Unit 7–8)',
          desc: '共 48 個拼字單字（Unit 7 L1–L3 與 Unit 8 L1），含 SVG 圖示、自然拼讀與發音練習。',
          href: './g02/english/1b-spelling-u7-u8.html',
          tags: 'g02 二年級 english 英文 spelling contest 1b unit 7 unit 8 goat lamb too new'
        }
      ];

      /* ========================================================================
         2. 全學齡年級定義（G01 ～ G12 獨立分級 + Topics 跨年級專題）
         ======================================================================== */
      const GRADES = [
        { id: 'g01', short: 'G01', name: '國小一年級（G01）', stage: 'elementary', folder: 'g01/' },
        { id: 'g02', short: 'G02', name: '國小二年級（G02 · 目前）', stage: 'elementary', folder: 'g02/' },
        { id: 'g03', short: 'G03', name: '國小三年級（G03）', stage: 'elementary', folder: 'g03/' },
        { id: 'g04', short: 'G04', name: '國小四年級（G04）', stage: 'elementary', folder: 'g04/' },
        { id: 'g05', short: 'G05', name: '國小五年級（G05）', stage: 'elementary', folder: 'g05/' },
        { id: 'g06', short: 'G06', name: '國小六年級（G06）', stage: 'elementary', folder: 'g06/' },
        { id: 'g07', short: 'G07', name: '國中七年級（G07 / 國一）', stage: 'junior', folder: 'g07/' },
        { id: 'g08', short: 'G08', name: '國中八年級（G08 / 國二）', stage: 'junior', folder: 'g08/' },
        { id: 'g09', short: 'G09', name: '國中九年級（G09 / 國三）', stage: 'junior', folder: 'g09/' },
        { id: 'g10', short: 'G10', name: '高中十年級（G10 / 高一）', stage: 'senior', folder: 'g10/' },
        { id: 'g11', short: 'G11', name: '高中十一年級（G11 / 高二）', stage: 'senior', folder: 'g11/' },
        { id: 'g12', short: 'G12', name: '高中十二年級（G12 / 高三）', stage: 'senior', folder: 'g12/' },
        { id: 'topics', short: 'Topics', name: '跨年級興趣專題（Topics）', stage: 'topics', folder: 'topics/' }
      ];

      const SUBJECTS = [
        { id: 'all', label: '全部科目', chipClass: '' },
        { id: 'english', label: '英文 English', chipClass: 'chip-english' },
        { id: 'math', label: '數學 Math', chipClass: 'chip-math' },
        { id: 'mandarin', label: '國語文 Mandarin', chipClass: 'chip-mandarin' },
        { id: 'science', label: '自然科學 Science', chipClass: 'chip-science' },
        { id: 'social', label: '社會科 Social', chipClass: 'chip-social' },
        { id: 'minecraft', label: '麥塊 Minecraft', chipClass: 'chip-minecraft' },
        { id: 'music', label: '音樂 Music', chipClass: 'chip-music' }
      ];

      /* ========================================================================
         3. 自動產生 G01–G12 與 Topics 的各科標準預留卡片（不需手動重複寫 HTML）
         ======================================================================== */
      function buildAllCards() {
        const plannedCards = [];

        GRADES.forEach((g) => {
          if (g.id === 'topics') {
            plannedCards.push(
              {
                grade: 'topics',
                subject: 'minecraft',
                status: 'planned',
                title: 'Minecraft 麥塊學習專題',
                desc: '可放置麥塊英文單字、紅石邏輯電路、建築比例與指令教學互動卡。',
                href: './topics/minecraft/',
                tags: 'topics minecraft 麥塊 紅石 指令 方塊 建築'
              },
              {
                grade: 'topics',
                subject: 'music',
                status: 'planned',
                title: '音樂節拍與五線譜專題',
                desc: '可放置節拍器互動、音符辨識、視唱聽寫與基礎樂理練習卡。',
                href: './topics/music/',
                tags: 'topics music 音樂 節拍 五線譜 音符 樂理'
              }
            );
            return;
          }

          const isElementary = g.stage === 'elementary';
          const isJunior = g.stage === 'junior';

          const gradeSubjects = [
            {
              subject: 'english',
              title: `${g.short} 英文學習區`,
              desc: isElementary
                ? '單字卡、自然拼讀（Phonics）、句型與會話練習。'
                : '核心單字、文法句型拆解、克漏字與閱讀理解重點。'
            },
            {
              subject: 'math',
              title: `${g.short} 數學學習區`,
              desc: isElementary
                ? '計算練習、應用題圖解、時間與幾何測量互動卡。'
                : '代數、幾何證明、函數圖形與核心公式步驟拆解。'
            },
            {
              subject: 'mandarin',
              title: `${g.short} ${isElementary ? '國語' : '國文'}學習區`,
              desc: isElementary
                ? '生字筆順、部首造詞、成語故事與閱讀理解。'
                : '文言文重點、修辭解析、國學常識與寫作結構。'
            },
            {
              subject: 'science',
              title: `${g.short} ${isElementary ? '自然' : isJunior ? '自然（生物/理化/地科）' : '自然（物理/化學/生物/地科）'}區`,
              desc: isElementary
                ? '動植物觀察、天氣現象與生活科學小實驗。'
                : '觀念圖解、實驗步驟、公式整理與重點題型練習。'
            },
            {
              subject: 'social',
              title: `${g.short} ${isElementary ? '社會' : '社會（歷史/地理/公民）'}區`,
              desc: isElementary
                ? '生活環境、家鄉文化與基本社會規範互動卡。'
                : '歷史時間軸、地理圖表判讀與公民制度重點整理。'
            }
          ];

          gradeSubjects.forEach((item) => {
            plannedCards.push({
              grade: g.id,
              subject: item.subject,
              status: 'planned',
              title: item.title,
              desc: item.desc,
              href: `./${g.id}/${item.subject}/`,
              tags: `${g.id} ${g.short} ${g.name} ${item.subject} ${item.title} ${item.desc}`
            });
          });
        });

        return [...MATERIALS, ...plannedCards];
      }

      const ALL_ITEMS = buildAllCards();

      /* ========================================================================
         4. State & DOM Rendering
         ======================================================================== */
      let selectedGrade = DEFAULT_GRADE;
      let selectedSubject = 'all';
      let searchQuery = '';

      const gradeFilterBar = document.getElementById('gradeFilterBar');
      const subjectFilterBar = document.getElementById('subjectFilterBar');
      const sectionsContainer = document.getElementById('sectionsContainer');
      const searchInput = document.getElementById('searchInput');
      const clearSearchBtn = document.getElementById('clearSearchBtn');
      const emptyState = document.getElementById('emptyState');
      const resetBtn = document.getElementById('resetBtn');
      const liveCountEl = document.getElementById('liveCount');
      const shownCountEl = document.getElementById('shownCount');

      liveCountEl.textContent = String(
        ALL_ITEMS.filter((item) => item.status === 'live').length
      );

      function getSubjectMeta(subjectId) {
        return SUBJECTS.find((s) => s.id === subjectId) || {
          id: subjectId,
          label: subjectId,
          chipClass: 'chip-english'
        };
      }

      function renderFilterBars() {
        // Order: Default grade first, then "All", then G01~G12, then Topics
        const orderedGrades = [
          GRADES.find((g) => g.id === DEFAULT_GRADE),
          { id: 'all', short: '全部 (All)' },
          ...GRADES.filter((g) => g.id !== DEFAULT_GRADE)
        ];

        gradeFilterBar.innerHTML = orderedGrades
          .map((g) => {
            const isDefault = g.id === DEFAULT_GRADE;
            const isActive = selectedGrade === g.id;
            const label = isDefault ? `${g.short}（目前）` : g.short;
            const liveInGrade =
              g.id === 'all'
                ? ALL_ITEMS.filter((i) => i.status === 'live').length
                : ALL_ITEMS.filter((i) => i.grade === g.id && i.status === 'live').length;

            const badgeHtml =
              liveInGrade > 0
                ? `<span class="pill-badge">${liveInGrade}</span>`
                : '';

            return `<button class="pill-btn ${isActive ? 'active' : ''}" type="button" data-grade="${g.id}">${label}${badgeHtml}</button>`;
          })
          .join('');

        subjectFilterBar.innerHTML = SUBJECTS.map((s) => {
          const isActive = selectedSubject === s.id;
          return `<button class="pill-btn pill-btn--subject ${isActive ? 'active' : ''}" type="button" data-subject="${s.id}">${s.label}</button>`;
        }).join('');
      }

      function renderSections() {
        const q = searchQuery.trim().toLowerCase();
        let totalShown = 0;

        const targetGrades =
          selectedGrade === 'all'
            ? GRADES
            : GRADES.filter((g) => g.id === selectedGrade);

        const sectionsHtml = targetGrades
          .map((gradeObj) => {
            const matchedItems = ALL_ITEMS.filter((item) => {
              if (item.grade !== gradeObj.id) return false;
              if (selectedSubject !== 'all' && item.subject !== selectedSubject) {
                return false;
              }
              if (q) {
                const haystack = `${item.title} ${item.desc} ${item.href} ${item.tags} ${gradeObj.name}`.toLowerCase();
                if (!haystack.includes(q)) return false;
              }
              return true;
            });

            if (matchedItems.length === 0) return '';

            totalShown += matchedItems.length;

            const cardsHtml = matchedItems
              .map((item) => {
                const subj = getSubjectMeta(item.subject);
                const isLive = item.status === 'live';
                const cleanPath = item.href.replace(/^\.\//, '');

                if (isLive) {
                  return `
                    <a class="card card--live" href="${item.href}">
                      <div>
                        <div class="card-top">
                          <span class="subject-chip ${subj.chipClass}">${gradeObj.short} · ${subj.label}</span>
                          <span class="status-tag status-tag--live">已上線</span>
                        </div>
                        <h3 class="card-title">${item.title}</h3>
                        <p class="card-desc">${item.desc}</p>
                      </div>
                      <div class="card-footer">
                        <span class="card-path">${cleanPath}</span>
                        <span class="card-cta">開啟練習 →</span>
                      </div>
                    </a>
                  `;
                }

                return `
                  <div class="card card--planned">
                    <div>
                      <div class="card-top">
                        <span class="subject-chip ${subj.chipClass}">${gradeObj.short} · ${subj.label}</span>
                        <span class="status-tag status-tag--planned">預留區 · ${cleanPath}</span>
                      </div>
                      <h3 class="card-title">${item.title}</h3>
                      <p class="card-desc">${item.desc}</p>
                    </div>
                    <div class="card-footer">
                      <span class="card-path">${cleanPath}...</span>
                      <span>待新增教材</span>
                    </div>
                  </div>
                `;
              })
              .join('');

            return `
              <section class="grade-section">
                <div class="section-header">
                  <div class="section-title-group">
                    <span class="section-icon" aria-hidden="true">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                      </svg>
                    </span>
                    <div>
                      <h2 class="section-title">${gradeObj.name}</h2>
                      <div class="section-subtitle">資料夾路徑：${gradeObj.folder} · 顯示 ${matchedItems.length} 項</div>
                    </div>
                  </div>
                </div>
                <div class="card-grid">${cardsHtml}</div>
              </section>
            `;
          })
          .join('');

        sectionsContainer.innerHTML = sectionsHtml;
        shownCountEl.textContent = String(totalShown);
        emptyState.classList.toggle('is-visible', totalShown === 0);
        clearSearchBtn.classList.toggle('is-visible', q.length > 0);
      }

      /* ========================================================================
         5. Event Listeners
         ======================================================================== */
      gradeFilterBar.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-grade]');
        if (!btn) return;
        selectedGrade = btn.dataset.grade;
        renderFilterBars();
        renderSections();
      });

      subjectFilterBar.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-subject]');
        if (!btn) return;
        selectedSubject = btn.dataset.subject;
        renderFilterBars();
        renderSections();
      });

      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderSections();
      });

      clearSearchBtn.addEventListener('click', () => {
        searchQuery = '';
        searchInput.value = '';
        renderSections();
        searchInput.focus();
      });

      resetBtn.addEventListener('click', () => {
        selectedGrade = DEFAULT_GRADE;
        selectedSubject = 'all';
        searchQuery = '';
        searchInput.value = '';
        renderFilterBars();
        renderSections();
      });

      // Initial render
      renderFilterBars();
      renderSections();
    })();
  </script>
</body>
</html>
